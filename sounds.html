<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sound Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #1d1a24;
        --panel: #2b2636;
        --btn: #3b3449;
        --btn-hover: #4d4460;
        --text: #f5f0ff;
        --dim: #a99fbd;
        --accent: #ffd84a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.4 system-ui, sans-serif;
        padding: 20px 16px 40px;
      }
      h1 {
        font: 34px 'Lilita One', system-ui, sans-serif;
        color: var(--accent);
        margin: 0 0 4px;
      }
      p {
        color: var(--dim);
        margin: 0 0 16px;
      }
      section {
        background: var(--panel);
        border-radius: 12px;
        padding: 12px 14px 14px;
        margin: 0 0 12px;
        max-width: 980px;
      }
      h2 {
        font: 19px 'Lilita One', system-ui, sans-serif;
        margin: 0 0 10px;
        letter-spacing: 0.3px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        background: var(--btn);
        color: var(--text);
        border: 0;
        border-radius: 8px;
        padding: 9px 13px;
        font: 14px system-ui, sans-serif;
        cursor: pointer;
      }
      button:hover {
        background: var(--btn-hover);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button.big {
        background: #6b4fd8;
      }
      label {
        color: var(--dim);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 12px;
      }
      #status {
        color: var(--dim);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Bunny Brigade sound board</h1>
    <p>Every sound in the game, played through the game's own mixer. <span id="status"></span></p>
    <label><input type="checkbox" id="fox" /> play weapons as a fox's (deeper, quieter)</label>
    <div id="board"></div>
    <script type="module" src="/src/soundboard.ts"></script>
  </body>
</html>
